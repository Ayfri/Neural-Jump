[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-jump"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "numpy==2.5.3",
    "pygame-ce==2.5.8",
    "torch==2.14.0",
    # torch.compile's backend, which torch ships on linux and not on windows
    "triton-windows==3.8.0.post28 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pyrefly==1.3.0"]

[tool.pyrefly]
preset = "strict"
python-interpreter-path = ".venv/Scripts/python.exe"
project-includes = ["ai", "game", "run-ai.py", "run-game.py"]

[tool.setuptools.packages.find]
include = ["ai", "game"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
